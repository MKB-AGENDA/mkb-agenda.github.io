<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MKBAgenda | Premium</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root { --pink: #ff40b5; --bg: #050505; --card: #111111; --text: #ffffff; --border: rgba(255,255,255,0.12); --green: #2ecc71; --blue: #3498db; }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text); padding: 10px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        
        #empresaTitle { color: var(--blue); font-size: 28px; font-weight: 800; margin: 20px 0; text-align: center; width: 100%; }

        .client-wrapper { display: flex; flex-direction: column; gap: 30px; width: 100%; max-width: 1100px; margin-top: 20px; }

        @media (min-width: 850px) {
            .client-wrapper { flex-direction: row; align-items: flex-start; justify-content: center; }
            #clientProfileBox { flex: 1; max-width: 400px; position: sticky; top: 20px; text-align: left !important; }
            #mainAgenda { flex: 1; max-width: 600px; }
        }

        #clientProfileBox { text-align: center; }
        #displayPhoto { width: 100%; aspect-ratio: 1/1; border-radius: 30px; object-fit: cover; border: 1px solid var(--border); background: #1a1a1a; }
        #displayBio { margin-top: 15px; font-size: 20px; font-weight: 700; color: #fff; }

        .card-inner { background: var(--card); padding: 30px; border-radius: 24px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; }

        .hours-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; max-height: 400px; overflow-y: auto; padding-right: 5px; }
        .h-pill { background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 12px; text-align: center; padding: 15px 5px; cursor: pointer; font-weight: 600; font-size: 15px; }
        .h-pill.active { border: 2px solid var(--pink) !important; color: var(--pink); }
        .h-pill.expired { opacity: 0.3; cursor: not-allowed; pointer-events: none; }

        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin: 15px 0; }
        .day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.05); border-radius: 10px; cursor: pointer; border: 1px solid transparent; }
        .day.selected { background: var(--pink) !important; color: #fff; border-color: var(--pink); }
        .day.has-hours { border: 2px solid var(--pink); color: var(--pink); font-weight: bold; }

        input, textarea, select { width: 100%; padding: 16px; margin-top: 12px; background: #000; color: #fff; border-radius: 14px; border: 1px solid var(--border); font-size: 16px; }
        .btn-main { width: 100%; padding: 18px; border-radius: 16px; border:none; font-weight: 700; cursor: pointer; margin-top: 12px; font-size: 16px; }
        .btn-pink { background: var(--pink); color: #fff; }
        .btn-green { background: var(--green); color: #000; }
        .btn-sec { background: rgba(255,255,255,0.1); color: #fff; padding: 10px; border-radius: 12px; border: 1px solid var(--border); cursor: pointer; }

        .hidden { display: none !important; }
        
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 10000; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: #1a1a1a; padding: 30px; border-radius: 28px; border: 2px solid var(--pink); width: 100%; max-width: 480px; }
        .modal-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    </style>
</head>
<body>

<h2 id="empresaTitle">MKBAgenda</h2>

<div class="client-wrapper">
    <div id="clientProfileBox" class="hidden">
        <img id="displayPhoto" src="">
        <div id="displayBio">Loading...</div>
    </div>

    <div id="mainAgenda">
        <div id="profLogin" class="card-inner">
            <h3 style="text-align:center">Admin Login</h3>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="pass" placeholder="Password">
            <button class="btn-main btn-pink" onclick="login()">Login</button>
            <p style="text-align:center; font-size:14px; margin-top:15px; color:#888;">No account? <a href="javascript:void(0)" onclick="showScreen('profRegister')" style="color:var(--pink)">Create Account</a></p>
        </div>

        <div id="profRegister" class="hidden card-inner">
            <h3 style="text-align:center">New Account</h3>
            <input type="email" id="regEmail" placeholder="New Email">
            <input type="password" id="regPass" placeholder="New Password">
            <div style="background:rgba(255,64,181,0.1); padding:15px; border-radius:12px; margin-top:15px; text-align:center; color:var(--pink);">License: R$ 500,00</div>
            <button class="btn-main btn-green" onclick="placeOrder()">REQUEST ACCESS</button>
            <button class="btn-sec" onclick="showScreen('profLogin')" style="width:100%; margin-top:10px;">Back</button>
        </div>

        <div id="admSection" class="hidden card-inner">
            <div style="display:flex; justify-content:space-between; margin-bottom: 20px;">
                <button class="btn-sec" onclick="logout()">Logout</button>
                <b id="tokenDisplay" style="color:var(--pink)"></b>
            </div>

            <div style="text-align:center; margin-bottom: 20px;">
                <img id="imgPreview" src="https://via.placeholder.com/150" style="width:140px; height:140px; border-radius:50%; border:3px solid var(--pink); cursor:pointer;" onclick="document.getElementById('fileInput').click()">
                <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleImage(this)">
            </div>

            <input type="text" id="companyNameInput" placeholder="Business Name">
            <input type="number" id="myPhone" placeholder="WhatsApp (5521...)">
            <textarea id="bioInput" placeholder="Bio description..."></textarea>

            <h4 style="margin: 20px 0 10px;">Manage Services</h4>
            <div id="servicesList"></div>
            <div style="display:flex; gap:10px; margin-top:10px;">
                <input type="text" id="newServiceInput" placeholder="Service Name" style="margin:0;">
                <button class="btn-sec" onclick="addService()" style="background:var(--blue);">Add</button>
            </div>

            <button class="btn-main btn-green" onclick="saveConfig()" style="margin-top:30px;">SAVE ALL SETTINGS</button>
            <button class="btn-main btn-pink" onclick="showScreen('agendaCore')">OPEN CALENDAR</button>
        </div>

        <div id="agendaCore" class="hidden card-inner">
            <button id="btnBackEditor" class="btn-sec" onclick="showScreen('admSection')" style="width:100%; margin-bottom:15px;">⚙️ Back to Editor</button>
            <div style="display:flex; justify-content: space-between; align-items:center; margin-bottom: 15px;">
                <button class="btn-sec" onclick="changeMonth(-1)">◀</button>
                <b id="monthLabel" style="font-size: 18px;"></b>
                <button class="btn-sec" onclick="changeMonth(1)">▶</button>
            </div>
            <div class="cal-grid" id="admCalendar"></div>
            <div class="hours-grid" id="admHoursList"></div>
            <button id="btnShare" class="btn-main hidden" onclick="shareAgenda()" style="background:#f1c40f; color:#000;">🔗 COPY GITHUB LINK</button>
        </div>
    </div>
</div>

<div id="modalBooking" class="modal hidden">
    <div class="modal-content">
        <h3 style="margin:0; color:var(--pink); text-align:center;">Confirm Booking</h3>
        <p id="modalTimeLabel" style="text-align:center; font-weight:600; margin:10px 0;"></p>
        <div class="modal-grid-2">
            <input type="text" id="clientName" placeholder="Full Name">
            <input type="text" id="clientObs" placeholder="Observations">
        </div>
        <select id="serviceSelect"></select>
        <button class="btn-main btn-pink" onclick="confirmBooking()">CONFIRM & SEND</button>
        <button class="btn-sec" style="width:100%; margin-top:10px;" onclick="closeModals()">Cancel</button>
    </div>
</div>

<script>
const firebaseConfig = { apiKey: "AIzaSyDZcwSrA4dmQY-XKVXQi_jXyz01aZhCr1Q", authDomain: "mkbagenda-82701.firebaseapp.com", databaseURL: "https://mkbagenda-82701-default-rtdb.firebaseio.com", projectId: "mkbagenda-82701", storageBucket: "mkbagenda-82701.firebasestorage.app", messagingSenderId: "755222857201", appId: "1:755222857201:web:1aef394b22919a78b4f050" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let agendaMaster = {}, activeDay = null, tempHour = null, myPhone = "", services = [], loggedUser = null, userToken = null, isClientMode = false, base64Image = "";
let curMonth = new Date().getMonth(), curYear = new Date().getFullYear();

function showScreen(id) {
    document.querySelectorAll('.card-inner').forEach(el => el.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
    if(id === 'agendaCore' && !isClientMode) document.getElementById('btnShare').classList.remove('hidden');
}

function handleImage(input) {
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = e => { base64Image = e.target.result; document.getElementById('imgPreview').src = base64Image; };
        reader.readAsDataURL(input.files[0]);
    }
}

async function login() {
    const e = document.getElementById('email').value.trim().toLowerCase(), p = document.getElementById('pass').value;
    const USERS = { "netosolucoes12@gmail.com": "jworg445566", "sarajanemkb@gmail.com": "jworg445566" };
    if(USERS[e] === p) { loggedUser = e.replace(/\./g, '_'); localStorage.setItem('mkb_user', e); await checkToken(loggedUser); showScreen('admSection'); } 
    else alert("Invalid login.");
}

async function checkToken(uid) {
    const snap = await db.ref('tokens/'+uid).get();
    userToken = snap.exists() ? snap.val() : "MKB-"+Math.floor(10000+Math.random()*90000);
    if(!snap.exists()) { await db.ref('tokens/'+uid).set(userToken); await db.ref('tokenMap/'+userToken).set(uid); }
    loadData(uid);
}

function loadData(uid) {
    db.ref('users/'+uid).on('value', s => {
        const d = s.val() || {}; 
        agendaMaster = d.agenda || {}; 
        myPhone = d.phone || ""; 
        services = d.services || ["Standard Service"];
        base64Image = d.profilePhoto || "";
        document.getElementById('displayPhoto').src = base64Image || "https://via.placeholder.com/400";
        document.getElementById('displayBio').innerText = d.profileBio || "";
        document.getElementById('empresaTitle').innerText = d.companyName || "Agenda";
        document.getElementById('tokenDisplay').innerText = "ID: " + userToken;
        if(!isClientMode) {
            document.getElementById('companyNameInput').value = d.companyName || "";
            document.getElementById('myPhone').value = myPhone;
            document.getElementById('bioInput').value = d.profileBio || "";
            if(base64Image) document.getElementById('imgPreview').src = base64Image;
            renderServicesEditor();
        }
        updateUI();
    });
}

function renderServicesEditor() {
    const list = document.getElementById('servicesList'); list.innerHTML = "";
    services.forEach((s, idx) => {
        const div = document.createElement('div');
        div.style = "display:flex; justify-content:space-between; background:rgba(255,255,255,0.05); padding:10px; border-radius:10px; margin-top:5px; border:1px solid var(--border);";
        div.innerHTML = `<span>${s}</span><button onclick="removeService(${idx})" style="color:red; background:none; border:none; cursor:pointer;">✖</button>`;
        list.appendChild(div);
    });
}

function addService() { const val = document.getElementById('newServiceInput').value.trim(); if(val) { services.push(val); document.getElementById('newServiceInput').value = ""; renderServicesEditor(); } }
function removeService(idx) { services.splice(idx, 1); renderServicesEditor(); }

function saveConfig() {
    if(loggedUser) {
        db.ref('users/'+loggedUser).update({ 
            companyName: document.getElementById('companyNameInput').value, phone: document.getElementById('myPhone').value, 
            profileBio: document.getElementById('bioInput').value, profilePhoto: base64Image, services: services 
        }).then(() => alert("Saved!"));
    }
}

function isTimeExpired(day, time) {
    const [d, m, y] = day.split('-').map(Number);
    const [h, min] = time.split(':').map(Number);
    const targetDate = new Date(y, m - 1, d, h, min);
    const brTime = new Date(new Date().toLocaleString("en-US", {timeZone: "America/Sao_Paulo"}));
    return brTime > targetDate;
}

// CORREÇÃO: Função de renderização agora destaca corretamente os dias salvos
function renderCalendar() {
    const grid = document.getElementById('admCalendar'); grid.innerHTML = "";
    document.getElementById('monthLabel').innerText = `${new Intl.DateTimeFormat('en-US', {month:'long'}).format(new Date(curYear, curMonth))} / ${curYear}`;
    const days = new Date(curYear, curMonth+1, 0).getDate();
    const start = new Date(curYear, curMonth, 1).getDay();
    for(let i=0; i<start; i++) grid.innerHTML += `<div></div>`;
    for(let d=1; d<=days; d++) {
        const k = `${d}-${curMonth+1}-${curYear}`;
        const hasHours = agendaMaster['Master']?.[k] && Object.keys(agendaMaster['Master'][k]).length > 0;
        const div = document.createElement('div');
        div.className = `day ${activeDay === k ? 'selected' : ''} ${hasHours ? 'has-hours' : ''}`;
        div.innerText = d; div.onclick = () => { activeDay = k; updateUI(); }; grid.appendChild(div);
    }
}

function renderHours() {
    const grid = document.getElementById('admHoursList'); grid.innerHTML = "";
    const dayData = agendaMaster['Master']?.[activeDay] || {};
    const baseHours = [];
    for(let i=5; i<=23; i++) { let hh = i < 10 ? '0'+i : i; baseHours.push(`${hh}:00`, `${hh}:30`); }

    baseHours.forEach(h => {
        const info = dayData[h];
        const expired = isTimeExpired(activeDay, h);
        if(isClientMode && (!info || expired)) return;

        const p = document.createElement('div');
        p.className = `h-pill ${info ? 'active' : ''} ${expired ? 'expired' : ''}`;
        p.innerHTML = `<b>${h}</b>`;
        p.onclick = () => {
            tempHour = h;
            if(isClientMode) {
                document.getElementById('serviceSelect').innerHTML = services.map(s => `<option value="${s}">${s}</option>`).join('');
                document.getElementById('modalTimeLabel').innerText = `${activeDay} at ${h}`;
                document.getElementById('modalBooking').classList.remove('hidden');
            } else {
                if(!agendaMaster['Master']) agendaMaster['Master'] = {};
                if(!agendaMaster['Master'][activeDay]) agendaMaster['Master'][activeDay] = {};
                if(info) delete agendaMaster['Master'][activeDay][h];
                else agendaMaster['Master'][activeDay][h] = {s:"OPEN"};
                db.ref('users/'+loggedUser).update({agenda: agendaMaster});
            }
        };
        grid.appendChild(p);
    });
}

function confirmBooking() {
    const name = document.getElementById('clientName').value.trim();
    const obs = document.getElementById('clientObs').value.trim();
    const svc = document.getElementById('serviceSelect').value;
    if(!name) return alert("Enter name");
    const msg = `Booking:\nService: ${svc}\nName: ${name}\nDate: ${activeDay} at ${tempHour}\nNotes: ${obs}`;
    window.open(`https://wa.me/${myPhone}?text=${encodeURIComponent(msg)}`, '_blank');
    closeModals();
}

function updateUI() { renderCalendar(); if(activeDay) renderHours(); }
function logout() { localStorage.clear(); location.reload(); }
function closeModals() { document.getElementById('modalBooking').classList.add('hidden'); }
function changeMonth(v) { curMonth += v; if(curMonth>11){curMonth=0;curYear++} if(curMonth<0){curMonth=11;curYear--} renderCalendar(); }
function shareAgenda() { const link = `https://mkb-agenda.github.io/?id=${userToken}`; navigator.clipboard.writeText(link).then(() => alert("Link Copied!")); }
function placeOrder() { window.open(`https://wa.me/5521991455681?text=Order MKBAgenda License`, '_blank'); }

window.onload = async () => {
    const id = new URLSearchParams(window.location.search).get('id');
    if(id) {
        isClientMode = true; 
        document.getElementById('clientProfileBox').classList.remove('hidden');
        document.getElementById('btnBackEditor').style.display = 'none';
        document.getElementById('profLogin').style.display = 'none';
        const snap = await db.ref('tokenMap/'+id).get();
        if(snap.exists()) { loggedUser = snap.val(); loadData(loggedUser); showScreen('agendaCore'); }
    } else {
        const u = localStorage.getItem('mkb_user');
        if(u) { loggedUser = u.replace(/\./g, '_'); await checkToken(loggedUser); showScreen('admSection'); }
    }
};
</script>
</body>
</html>
