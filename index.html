<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MKBAgenda | Premium</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root { --pink: #ff40b5; --bg: #050505; --card: #111111; --text: #ffffff; --border: rgba(255,255,255,0.12); --green: #2ecc71; --blue: #3498db; --red: #e74c3c; }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text); padding: 10px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        
        #empresaTitle { color: var(--blue); font-size: 28px; font-weight: 800; margin: 20px 0; text-align: center; width: 100%; }

        .client-wrapper { display: flex; flex-direction: column; gap: 30px; width: 100%; max-width: 1100px; margin-top: 20px; }

        @media (min-width: 850px) {
            .client-wrapper { flex-direction: row; align-items: flex-start; justify-content: center; }
            #clientProfileBox { flex: 1; max-width: 400px; position: sticky; top: 20px; }
            #mainAgenda { flex: 1; max-width: 600px; }
        }

        #displayPhoto { width: 100%; aspect-ratio: 1/1; border-radius: 30px; object-fit: cover; border: 1px solid var(--border); background: #1a1a1a; }
        #displayBio { margin-top: 15px; font-size: 20px; font-weight: 700; text-align: center; }

        .card-inner { background: var(--card); padding: 30px; border-radius: 24px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; }

        #photoEditor { display: none; position: relative; width: 300px; height: 300px; overflow: hidden; border-radius: 20px; background: #000; margin: 0 auto 15px; border: 2px solid var(--pink); cursor: move; }
        #imageToCrop { position: absolute; top: 50%; left: 50%; transform-origin: center; pointer-events: none; }
        .editor-controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 20px; }

        .hours-grid { display: grid; grid-template-columns: 1fr; gap: 10px; max-height: 450px; overflow-y: auto; padding-right: 5px; }
        .h-pill { background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 12px; padding: 15px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .h-pill.active { border: 2px solid var(--pink); }
        .h-pill.booked { border: 2px solid var(--green); background: rgba(46, 204, 113, 0.1); }

        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin: 15px 0; }
        .day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.05); border-radius: 10px; cursor: pointer; }
        .day.selected { background: var(--pink) !important; color: #fff; }
        .day.has-hours { border: 2px solid var(--pink); color: var(--pink); font-weight: bold; }

        input, textarea, select { width: 100%; padding: 16px; margin-top: 12px; background: #000; color: #fff; border-radius: 14px; border: 1px solid var(--border); font-size: 16px; }
        .btn-main { width: 100%; padding: 18px; border-radius: 16px; border:none; font-weight: 700; cursor: pointer; margin-top: 12px; font-size: 16px; }
        .btn-pink { background: var(--pink); color: #fff; }
        .btn-green { background: var(--green); color: #000; }
        .btn-red { background: var(--red); color: #fff; padding: 8px 15px; border-radius: 8px; font-size: 12px; border: none; cursor: pointer; }
        .btn-sec { background: rgba(255,255,255,0.1); color: #fff; padding: 10px; border-radius: 12px; border: 1px solid var(--border); cursor: pointer; }

        .hidden { display: none !important; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 10000; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: #1a1a1a; padding: 30px; border-radius: 28px; border: 2px solid var(--pink); width: 100%; max-width: 480px; }
    </style>
</head>
<body>

<h2 id="empresaTitle">MKBAgenda</h2>

<div class="client-wrapper">
    <div id="clientProfileBox" class="hidden">
        <img id="displayPhoto" src="">
        <div id="displayBio">Loading...</div>
    </div>

    <div id="mainAgenda">
        <div id="profLogin" class="card-inner hidden">
            <h3 style="text-align:center">Admin Login</h3>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="pass" placeholder="Password">
            <button class="btn-main btn-pink" onclick="login()">Login</button>
            <p style="text-align:center; font-size:14px; margin-top:15px; color:#888;">No account? <a href="javascript:void(0)" onclick="showScreen('profRegister')" style="color:var(--pink)">Create Account</a></p>
        </div>

        <div id="profRegister" class="hidden card-inner">
            <h3 style="text-align:center">Create Account</h3>
            <input type="email" id="regEmail" placeholder="New Email">
            <input type="password" id="regPass" placeholder="New Password">
            <div style="background:rgba(255,64,181,0.1); padding:15px; border-radius:12px; margin-top:15px; text-align:center; color:var(--pink);">License Required: R$ 500,00</div>
            <button class="btn-main btn-green" onclick="placeOrder()">REQUEST ACCESS & PAY</button>
            <button class="btn-sec" onclick="showScreen('profLogin')" style="width:100%; margin-top:10px;">Back to Login</button>
        </div>

        <div id="admSection" class="hidden card-inner">
            <div style="display:flex; justify-content:space-between; margin-bottom: 20px;">
                <button class="btn-sec" onclick="logout()">Logout</button>
                <b id="tokenDisplay" style="color:var(--pink)"></b>
            </div>
            <div style="text-align:center;">
                <div id="photoEditor">
                    <img id="imageToCrop" src="">
                </div>
                <div id="editorTools" class="hidden">
                    <div class="editor-controls">
                        <button class="btn-sec" onclick="adjustZoom(0.1)">Zoom +</button>
                        <button class="btn-sec" onclick="adjustZoom(-0.1)">Zoom -</button>
                        <button class="btn-main btn-pink" onclick="confirmCrop()" style="width:auto; margin:0; padding:10px 20px;">CONFIRM PHOTO</button>
                    </div>
                </div>
                <img id="imgPreview" src="https://via.placeholder.com/150" style="width:120px; height:120px; border-radius:50%; border:3px solid var(--pink); cursor:pointer; margin-bottom: 10px;" onclick="document.getElementById('fileInput').click()">
                <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="initPhotoEditor(this)">
            </div>
            <input type="text" id="companyNameInput" placeholder="Business Name">
            <input type="number" id="myPhone" placeholder="WhatsApp (5521...)">
            <textarea id="bioInput" placeholder="Bio description..."></textarea>
            <h4 style="margin: 20px 0 10px;">Services</h4>
            <div id="servicesList"></div>
            <div style="display:flex; gap:10px; margin-top:10px;">
                <input type="text" id="newServiceInput" placeholder="Add Service" style="margin:0;">
                <button class="btn-sec" onclick="addService()">Add</button>
            </div>
            <button class="btn-main btn-green" onclick="saveConfig()">SAVE SETTINGS</button>
            <button class="btn-main btn-pink" onclick="showScreen('agendaCore')">MANAGE CALENDAR</button>
        </div>

        <div id="agendaCore" class="hidden card-inner">
            <button id="btnBackEditor" class="btn-sec" onclick="showScreen('admSection')" style="width:100%; margin-bottom:15px;">⚙️ Editor</button>
            <div style="display:flex; justify-content: space-between; align-items:center; margin-bottom: 15px;">
                <button class="btn-sec" onclick="changeMonth(-1)">◀</button>
                <b id="monthLabel"></b>
                <button class="btn-sec" onclick="changeMonth(1)">▶</button>
            </div>
            <div class="cal-grid" id="admCalendar"></div>
            <div class="hours-grid" id="admHoursList"></div>
            <button id="btnShare" class="btn-main hidden" onclick="shareAgenda()" style="background:#f1c40f; color:#000;">🔗 COPY LINK</button>
        </div>
    </div>
</div>

<div id="modalBooking" class="modal hidden">
    <div class="modal-content">
        <h3 style="text-align:center; color:var(--pink);">Agendar Horário</h3>
        <p id="modalTimeLabel" style="text-align:center; font-weight:bold;"></p>
        <input type="text" id="clientName" placeholder="Seu Nome Completo">
        <input type="text" id="clientObs" placeholder="Observações (Opcional)">
        <select id="serviceSelect"></select>
        <button class="btn-main btn-pink" onclick="confirmBooking()">BOOK NOW</button>
        <button class="btn-sec" style="width:100%; margin-top:10px;" onclick="closeModals()">Cancel</button>
    </div>
</div>

<script>
const firebaseConfig = { apiKey: "AIzaSyDZcwSrA4dmQY-XKVXQi_jXyz01aZhCr1Q", authDomain: "mkbagenda-82701.firebaseapp.com", databaseURL: "https://mkbagenda-82701-default-rtdb.firebaseio.com", projectId: "mkbagenda-82701", storageBucket: "mkbagenda-82701.firebasestorage.app", messagingSenderId: "755222857201", appId: "1:755222857201:web:1aef394b22919a78b4f050" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let agendaMaster = {}, activeDay = null, tempHour = null, myPhone = "", services = [], loggedUser = null, userToken = null, isClientMode = false, base64Image = "";
let curMonth = new Date().getMonth(), curYear = new Date().getFullYear();
let currentZoom = 1, imgPosX = 0, imgPosY = 0, isDragging = false, startX, startY;

function showScreen(id) {
    document.querySelectorAll('.card-inner, #profRegister').forEach(el => el.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
    if(id === 'agendaCore' && !isClientMode) document.getElementById('btnShare').classList.remove('hidden');
}

// Editor de Foto
function initPhotoEditor(input) {
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = e => {
            const img = document.getElementById('imageToCrop');
            img.src = e.target.result;
            img.onload = () => {
                document.getElementById('photoEditor').style.display = 'block';
                document.getElementById('editorTools').classList.remove('hidden');
                document.getElementById('imgPreview').classList.add('hidden');
                currentZoom = 1; imgPosX = 0; imgPosY = 0;
                applyImgTransform();
            };
        };
        reader.readAsDataURL(input.files[0]);
    }
}
function adjustZoom(val) { currentZoom = Math.max(0.1, currentZoom + val); applyImgTransform(); }
function applyImgTransform() {
    const img = document.getElementById('imageToCrop');
    img.style.transform = `translate(-50%, -50%) translate(${imgPosX}px, ${imgPosY}px) scale(${currentZoom})`;
}
const editor = document.getElementById('photoEditor');
editor.onmousedown = (e) => { isDragging = true; startX = e.clientX - imgPosX; startY = e.clientY - imgPosY; };
editor.ontouchstart = (e) => { isDragging = true; startX = e.touches[0].clientX - imgPosX; startY = e.touches[0].clientY - imgPosY; };
window.onmousemove = (e) => { if(isDragging) { imgPosX = e.clientX - startX; imgPosY = e.clientY - startY; applyImgTransform(); } };
window.ontouchmove = (e) => { if(isDragging) { imgPosX = e.touches[0].clientX - startX; imgPosY = e.touches[0].clientY - startY; applyImgTransform(); } };
window.onmouseup = window.ontouchend = () => isDragging = false;

function confirmCrop() {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 500; canvas.height = 500;
    const img = document.getElementById('imageToCrop');
    ctx.fillStyle = "#000"; ctx.fillRect(0,0,500,500);
    const scaleFactor = 500 / 300;
    const drawWidth = img.naturalWidth * currentZoom * scaleFactor;
    const drawHeight = img.naturalHeight * currentZoom * scaleFactor;
    const x = 250 + (imgPosX * scaleFactor) - (drawWidth / 2);
    const y = 250 + (imgPosY * scaleFactor) - (drawHeight / 2);
    ctx.drawImage(img, x, y, drawWidth, drawHeight);
    base64Image = canvas.toDataURL('image/jpeg', 0.9);
    document.getElementById('imgPreview').src = base64Image;
    document.getElementById('imgPreview').classList.remove('hidden');
    document.getElementById('photoEditor').style.display = 'none';
    document.getElementById('editorTools').classList.add('hidden');
}

async function login() {
    const e = document.getElementById('email').value.trim().toLowerCase(), p = document.getElementById('pass').value;
    const USERS = { "netosolucoes12@gmail.com": "jworg445566", "sarajanemkb@gmail.com": "jworg445566" };
    if(USERS[e] === p) { loggedUser = e.replace(/\./g, '_'); localStorage.setItem('mkb_user', e); await checkToken(loggedUser); showScreen('admSection'); } 
    else alert("Erro!");
}

async function checkToken(uid) {
    const snap = await db.ref('tokens/'+uid).get();
    userToken = snap.exists() ? snap.val() : "MKB-"+Math.floor(1000+Math.random()*9000);
    if(!snap.exists()) { await db.ref('tokens/'+uid).set(userToken); await db.ref('tokenMap/'+userToken).set(uid); }
    loadData(uid);
    document.getElementById('tokenDisplay').innerText = userToken;
}

function loadData(uid) {
    db.ref('users/'+uid).on('value', s => {
        const d = s.val() || {}; agendaMaster = d.agenda || {}; myPhone = d.phone || ""; services = d.services || [];
        base64Image = d.profilePhoto || "";
        document.getElementById('displayPhoto').src = base64Image || "https://via.placeholder.com/400";
        document.getElementById('displayBio').innerText = d.profileBio || "";
        document.getElementById('empresaTitle').innerText = d.companyName || "Agenda";
        if(!isClientMode) {
            document.getElementById('companyNameInput').value = d.companyName || "";
            document.getElementById('myPhone').value = myPhone;
            document.getElementById('bioInput').value = d.profileBio || "";
            if(base64Image) document.getElementById('imgPreview').src = base64Image;
            renderServicesEditor();
        }
        updateUI();
    });
}

function renderServicesEditor() {
    const list = document.getElementById('servicesList'); list.innerHTML = "";
    services.forEach((s, i) => { list.innerHTML += `<div style="display:flex; justify-content:space-between; margin-top:5px; padding:10px; background:#222; border-radius:10px;">${s} <span onclick="removeService(${i})" style="color:red; cursor:pointer;">✖</span></div>`; });
}
function addService() { const v = document.getElementById('newServiceInput').value; if(v){services.push(v); document.getElementById('newServiceInput').value=""; renderServicesEditor();} }
function removeService(i) { services.splice(i,1); renderServicesEditor(); }
function saveConfig() { db.ref('users/'+loggedUser).update({ companyName: document.getElementById('companyNameInput').value, phone: document.getElementById('myPhone').value, profileBio: document.getElementById('bioInput').value, profilePhoto: base64Image, services: services }).then(() => alert("Saved!")); }

function renderCalendar() {
    const grid = document.getElementById('admCalendar'); grid.innerHTML = "";
    document.getElementById('monthLabel').innerText = `${new Intl.DateTimeFormat('pt-BR', {month:'long'}).format(new Date(curYear, curMonth))} / ${curYear}`;
    const days = new Date(curYear, curMonth+1, 0).getDate();
    for(let d=1; d<=days; d++) {
        const k = `${d}-${curMonth+1}-${curYear}`;
        const has = agendaMaster['Master']?.[k];
        const div = document.createElement('div');
        div.className = `day ${activeDay === k ? 'selected' : ''} ${has ? 'has-hours' : ''}`;
        div.innerText = d; div.onclick = () => { activeDay = k; updateUI(); }; grid.appendChild(div);
    }
}

// LÓGICA DE HORÁRIOS ATUALIZADA
function renderHours() {
    const grid = document.getElementById('admHoursList'); grid.innerHTML = "";
    const dayData = agendaMaster['Master']?.[activeDay] || {};
    
    for(let i=8; i<=20; i++) {
        const h = `${i < 10 ? '0'+i : i}:00`;
        const info = dayData[h];
        
        // NOVO: Se estiver no modo cliente e o horário NÃO foi ativado no ADM, pula (não mostra)
        if(isClientMode && (!info || info.s !== "OPEN")) {
            // Se já tiver um cliente marcado, também não mostra para outros clientes
            if(info?.cliente) continue; 
            // Se não existe info nenhuma, pula
            if(!info) continue;
        }

        const p = document.createElement('div');
        p.className = `h-pill ${info ? (info.cliente ? 'booked' : 'active') : ''}`;
        let content = `<b>${h}</b>`;
        
        if(!isClientMode && info?.cliente) {
            content += `<div style="font-size:12px">👤 ${info.cliente} <button class="btn-red" onclick="cancelBooking('${h}')">CANCEL</button></div>`;
        }
        
        p.innerHTML = content;
        p.onclick = (e) => {
            if(e.target.tagName === 'BUTTON') return;
            tempHour = h;
            if(isClientMode) {
                if(info && !info.cliente) {
                    document.getElementById('serviceSelect').innerHTML = services.map(s => `<option value="${s}">${s}</option>`).join('');
                    document.getElementById('modalBooking').classList.remove('hidden');
                }
            } else {
                if(!agendaMaster['Master']) agendaMaster['Master'] = {};
                if(!agendaMaster['Master'][activeDay]) agendaMaster['Master'][activeDay] = {};
                if(info) delete agendaMaster['Master'][activeDay][h];
                else agendaMaster['Master'][activeDay][h] = {s:"OPEN"};
                db.ref('users/'+loggedUser).update({agenda: agendaMaster});
            }
        };
        grid.appendChild(p);
    }
}

function confirmBooking() {
    const n = document.getElementById('clientName').value;
    const o = document.getElementById('clientObs').value;
    const s = document.getElementById('serviceSelect').value;
    if(!n) return alert("Nome obrigatório");
    agendaMaster['Master'][activeDay][tempHour] = { cliente: n, obs: o, servico: s, s: "BOOKED" };
    db.ref('users/'+loggedUser).update({agenda: agendaMaster}).then(() => {
        window.open(`https://wa.me/${myPhone}?text=Agendamento: ${s} para ${n} em ${activeDay} as ${tempHour}`);
        closeModals();
    });
}
function cancelBooking(h) { if(confirm("Deseja desmarcar?")) { agendaMaster['Master'][activeDay][h] = {s:"OPEN"}; db.ref('users/'+loggedUser).update({agenda: agendaMaster}); } }
function updateUI() { renderCalendar(); if(activeDay) renderHours(); }
function logout() { localStorage.clear(); location.reload(); }
function closeModals() { document.getElementById('modalBooking').classList.add('hidden'); }
function changeMonth(v) { curMonth += v; renderCalendar(); }

function shareAgenda() { 
    const baseUrl = window.location.origin + window.location.pathname;
    const shareUrl = `${baseUrl}?id=${userToken}`;
    navigator.clipboard.writeText(shareUrl).then(() => alert("Link copiado: " + shareUrl)); 
}

function placeOrder() { window.open(`https://wa.me/5521991455681?text=Quero adquirir minha licença MKBAgenda`, '_blank'); }

window.onload = async () => {
    const id = new URLSearchParams(window.location.search).get('id');
    const savedUser = localStorage.getItem('mkb_user');

    if(id) {
        isClientMode = true;
        document.getElementById('clientProfileBox').classList.remove('hidden');
        const snap = await db.ref('tokenMap/'+id).get();
        if(snap.exists()) {
            loggedUser = snap.val();
            loadData(loggedUser);
            showScreen('agendaCore');
        } else {
            alert("Agenda não encontrada");
        }
    } else if(savedUser) {
        loggedUser = savedUser.replace(/\./g, '_');
        await checkToken(loggedUser);
        showScreen('admSection');
    } else {
        document.getElementById('profLogin').classList.remove('hidden');
    }
};
</script>
</body>
</html>
